    <text x="82" y="266" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#E6EDF7">transcript</text>
    <text x="82" y="286" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9FB0C8">interrupts, denials, api-requests, final text</text>
    <rect x="364" y="258" width="42" height="24" rx="12" fill="#0B1220" stroke="#60A5FA" stroke-opacity=".7"/>
    <text x="385" y="275" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#60A5FA">4</text>
    <path d="M420 270 C 470 270, 470 318, 520 318" fill="none" stroke="#60A5FA" stroke-opacity=".6" stroke-width="2"/>
