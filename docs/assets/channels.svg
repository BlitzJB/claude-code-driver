    <path d="M710 340H760" stroke="#1B763A" stroke-width="2" marker-end="url(#arrG)"/>
    <rect x="766" y="284" width="114" height="40" rx="10" fill="#F8FBF9" stroke="#1B763A"/>
    <text x="823" y="309" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#191F1A">events</text>
    <rect x="766" y="324" width="114" height="40" rx="10" fill="#F8FBF9" stroke="#1B763A"/>
    <text x="823" y="349" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#191F1A">state</text>
