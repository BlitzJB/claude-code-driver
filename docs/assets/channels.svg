    <text x="620" y="325" text-anchor="middle" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#D3D9D4">merges by authority</text>
    <text x="620" y="346" text-anchor="middle" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#D3D9D4">joins on real ids</text>
