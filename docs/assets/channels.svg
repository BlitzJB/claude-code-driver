    <path d="M710 336 H 760" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrT)"/>
    <rect x="766" y="276" width="114" height="40" rx="10" fill="#111A2E" stroke="#2DD4BF" stroke-opacity=".6"/>
    <text x="823" y="301" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#C9D4E5">events</text>
    <rect x="766" y="322" width="114" height="40" rx="10" fill="#111A2E" stroke="#2DD4BF" stroke-opacity=".6"/>
    <text x="823" y="347" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#C9D4E5">state</text>
    <text x="40" y="530" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#6B7C98">authority: process 6 &gt; hook 5 &gt; transcript 4 &gt; network 3 &gt; registry 2 &gt; screen 1</text>
  </g>

