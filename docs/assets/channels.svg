    <text x="615" y="296" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#5EEAD4">core</text>
    <text x="615" y="320" text-anchor="middle" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB8B2">merge by authority</text>
    <text x="615" y="340" text-anchor="middle" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB8B2">join on real ids</text>
    <text x="615" y="360" text-anchor="middle" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB8B2">claims · deadlines</text>
