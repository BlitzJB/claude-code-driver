  <rect x=".75" y=".75" width="918.5" height="554.5" rx="17.25" fill="none" stroke="#24324D" stroke-width="1.5"/>
  <text x="40" y="52" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#E6EDF7">Observation channels</text>
  <text x="40" y="78" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8B9BB4">Each fact keeps its source. A higher authority replaces a lower one; screen facts stay provisional.</text>
