    <circle cx="64" cy="204" r="6" fill="#2DD4BF"/>
    <text x="82" y="200" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#E6EDF7">hooks</text>
    <text x="82" y="220" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9FB0C8">prompt acks, tools, permissions, text</text>
    <rect x="364" y="192" width="42" height="24" rx="12" fill="#0B1220" stroke="#2DD4BF" stroke-opacity=".7"/>
    <text x="385" y="209" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2DD4BF">5</text>
