    <circle cx="64" cy="402" r="6" fill="#A78BFA"/>
    <text x="82" y="398" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#E6EDF7">registry</text>
    <text x="82" y="418" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9FB0C8">pid / version cross-check</text>
    <rect x="364" y="390" width="42" height="24" rx="12" fill="#0B1220" stroke="#A78BFA" stroke-opacity=".7"/>
    <text x="385" y="407" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#A78BFA">2</text>
