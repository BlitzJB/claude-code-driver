    <circle cx="64" cy="336" r="6" fill="#FBBF24"/>
    <text x="82" y="332" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#E6EDF7">network</text>
    <text x="82" y="352" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9FB0C8">bytes flowing, stalls (opt-in)</text>
    <rect x="364" y="324" width="42" height="24" rx="12" fill="#0B1220" stroke="#FBBF24" stroke-opacity=".7"/>
    <text x="385" y="341" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#FBBF24">3</text>
