    <circle cx="64" cy="468" r="6" fill="#FB7185"/>
    <text x="82" y="464" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#E6EDF7">screen</text>
    <text x="82" y="484" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9FB0C8">retry banners, dialogs, gates</text>
    <rect x="364" y="456" width="42" height="24" rx="12" fill="#0B1220" stroke="#FB7185" stroke-opacity=".7"/>
    <text x="385" y="473" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#FB7185">1</text>
