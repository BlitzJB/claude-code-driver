    <text x="60" y="222" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#3D453E">prompt acks, tools, permissions, text</text>
    <circle cx="404" cy="206" r="14" fill="#F8FBF9" stroke="#1B763A"/>
    <text x="404" y="211" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#1B763A">5</text>
    <path d="M430 206C480 206 480 322 530 322" fill="none" stroke="#1B763A" stroke-opacity=".55" stroke-width="2"/>
