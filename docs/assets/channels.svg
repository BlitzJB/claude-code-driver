    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1B763A"/></marker>
  </defs>
  <rect x=".75" y=".75" width="918.5" height="556.5" rx="18" fill="#F8FBF9" stroke="#D3D9D4" stroke-width="1.5"/>
  <text x="40" y="54" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="650" fill="#191F1A" letter-spacing="-0.3">Observation channels</text>
  <text x="40" y="82" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#636B65">Every fact remembers its source, and a higher-ranked source replaces a lower one.</text>
