    <text x="60" y="466" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" font-weight="600" fill="#191F1A">screen</text>
    <text x="60" y="486" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#3D453E">retry banners, dialogs, startup gates</text>
    <circle cx="404" cy="470" r="14" fill="#F8FBF9" stroke="#AB413E"/>
    <text x="404" y="475" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#AB413E">1</text>
