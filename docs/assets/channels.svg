    <circle cx="404" cy="338" r="14" fill="#F8FBF9" stroke="#976213"/>
    <text x="404" y="343" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#976213">3</text>
