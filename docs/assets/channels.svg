  <text x="40" y="530" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#636B65">The number is the authority rank. Screen facts never count as confirmed.</text>

