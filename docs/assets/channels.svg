    <text x="404" y="277" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#1F6A96">4</text>
    <path d="M430 272C480 272 480 322 530 322" fill="none" stroke="#1F6A96" stroke-opacity=".55" stroke-width="2"/>
