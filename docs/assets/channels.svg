    <text x="60" y="156" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#3D453E">pane exit and its status</text>
    <circle cx="404" cy="140" r="14" fill="#F8FBF9" stroke="#3D453E"/>
    <text x="404" y="145" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#3D453E">6</text>
