<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 628" width="920" height="628" role="img" aria-label="claude-code-driver layer diagram">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636B65"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1B763A"/></marker>
  </defs>
  <rect x=".75" y=".75" width="918.5" height="626.5" rx="18" fill="#F8FBF9" stroke="#D3D9D4" stroke-width="1.5"/>
  <text x="40" y="54" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="650" fill="#191F1A" letter-spacing="-0.3">Layers</text>
  <text x="40" y="82" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#636B65">Each layer imports only the layers below it. The public API reaches the rest through one port.</text>
  <g>
    <rect x="40" y="110" width="840" height="64" rx="12" fill="#DFF6E2" stroke="#1B763A" stroke-opacity=".7" stroke-width="1.5"/>
    <rect x="58" y="129" width="38.4" height="26" rx="13" fill="#F8FBF9" stroke="#1B763A"/><text x="68" y="146.5" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#1B763A">L4</text>
    <text x="128" y="138" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="600" fill="#191F1A">api/</text>
    <text x="128" y="160" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#3D453E">ClaudeSession, Turn, options and the event, state and error mappers</text>
    <text x="862" y="148" text-anchor="end" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#636B65">public, semver-stable</text>
  </g>
  <g><line x1="60" y1="180" x2="860" y2="180" stroke="#1B763A" stroke-width="1.5" stroke-dasharray="5 6"/>
    <rect x="364" y="167" width="192" height="26" rx="13" fill="#62D378"/>
    <text x="460" y="184.5" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#111511">SessionKernel port</text></g>
  <g>
    <rect x="40" y="202" width="840" height="64" rx="12" fill="#F0F4F0" stroke="#1B763A" stroke-opacity=".7" stroke-width="1.5"/>
    <rect x="58" y="221" width="56.8" height="26" rx="13" fill="#F8FBF9" stroke="#1B763A"/><text x="68" y="238.5" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#1B763A">L3.5</text>
    <text x="128" y="230" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="600" fill="#191F1A">runtime/</text>
    <text x="128" y="252" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#3D453E">the composition root that builds the real ports and wires the kernel</text>
    <text x="862" y="240" text-anchor="end" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#636B65">wiring only</text>
  </g>
  <g>
    <rect x="40" y="278" width="840" height="64" rx="12" fill="#E0F1FE" stroke="#1F6A96" stroke-opacity=".7" stroke-width="1.5"/>
    <rect x="58" y="297" width="38.4" height="26" rx="13" fill="#F8FBF9" stroke="#1F6A96"/><text x="68" y="314.5" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#1F6A96">L3</text>
    <text x="128" y="306" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="600" fill="#191F1A">session/</text>
    <text x="128" y="328" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#3D453E">step loop, scheduler, launcher, input executor, permission broker, lifecycle</text>
    <text x="862" y="316" text-anchor="end" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#636B65">impure, async</text>
  </g>
  <g>
    <rect x="40" y="354" width="840" height="64" rx="12" fill="#EBEFF5" stroke="#525E72" stroke-opacity=".7" stroke-width="1.5"/>
    <rect x="58" y="373" width="38.4" height="26" rx="13" fill="#F8FBF9" stroke="#525E72"/><text x="68" y="390.5" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#525E72">L2</text>
    <text x="128" y="382" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="600" fill="#191F1A">core/</text>
    <text x="128" y="404" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#3D453E">step(core, input) returns the next core, events and intents</text>
    <text x="862" y="392" text-anchor="end" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#636B65">pure, deterministic</text>
  </g>
  <g>
    <rect x="40" y="430" width="840" height="64" rx="12" fill="#FDF1D8" stroke="#976213" stroke-opacity=".7" stroke-width="1.5"/>
    <rect x="58" y="449" width="38.4" height="26" rx="13" fill="#F8FBF9" stroke="#976213"/><text x="68" y="466.5" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#976213">L1</text>
    <text x="128" y="458" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="600" fill="#191F1A">channels/</text>
    <text x="128" y="480" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#3D453E">normalizers and the Claude Code 2.1.316 profile</text>
    <text x="862" y="468" text-anchor="end" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#636B65">raw data to observations</text>
  </g>
  <g>
    <rect x="40" y="506" width="840" height="64" rx="12" fill="#FFE7E4" stroke="#AB413E" stroke-opacity=".7" stroke-width="1.5"/>
    <rect x="58" y="525" width="38.4" height="26" rx="13" fill="#F8FBF9" stroke="#AB413E"/><text x="68" y="542.5" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#AB413E">L0</text>
    <text x="128" y="534" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="600" fill="#191F1A">platform/</text>
    <text x="128" y="556" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#3D453E">tmux, transcript tail, hook servers, proxy sidecar, processes, settings</text>
    <text x="862" y="544" text-anchor="end" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#636B65">OS adapters</text>
  </g>
  <text x="40" y="600" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#636B65">model/ holds the shared types and imports nothing. testing/ holds the fakes and replay tools, and nothing imports it.</text>

</svg>
