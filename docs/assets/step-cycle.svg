<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 436" width="920" height="436" role="img" aria-label="The observe, step, execute cycle">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636B65"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1B763A"/></marker>
  </defs>
  <rect x=".75" y=".75" width="918.5" height="434.5" rx="18" fill="#F8FBF9" stroke="#D3D9D4" stroke-width="1.5"/>
  <text x="40" y="54" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="650" fill="#191F1A" letter-spacing="-0.3">One cycle</text>
  <text x="40" y="82" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#636B65">Time enters as data, so a recorded trace replays to the same events and state.</text>
  <g><rect x="40" y="124" width="190" height="66" rx="13" fill="#FFE7E4" stroke="#AB413E" stroke-opacity=".75" stroke-width="1.5"/>
    <text x="135" y="153" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15.5" font-weight="600" fill="#191F1A">L0 adapters</text>
    <text x="135" y="174" text-anchor="middle" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#3D453E">tmux, tail, hooks, proxy</text></g>
  <g><rect x="300" y="124" width="190" height="66" rx="13" fill="#FDF1D8" stroke="#976213" stroke-opacity=".75" stroke-width="1.5"/>
    <text x="395" y="153" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15.5" font-weight="600" fill="#191F1A">L1 normalizers</text>
    <text x="395" y="174" text-anchor="middle" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#3D453E">raw data to observations</text></g>
  <g><rect x="560" y="124" width="190" height="66" rx="13" fill="#EBEFF5" stroke="#525E72" stroke-opacity=".75" stroke-width="1.5"/>
    <text x="655" y="153" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15.5" font-weight="600" fill="#191F1A">L2 step()</text>
    <text x="655" y="174" text-anchor="middle" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#3D453E">the pure reducer</text></g>
  <g><rect x="790" y="124" width="90" height="66" rx="13" fill="#191F1A" stroke="#191F1A" stroke-opacity=".75" stroke-width="1.5"/>
    <text x="835" y="153" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15.5" font-weight="600" fill="#62D378">events</text>
    <text x="835" y="174" text-anchor="middle" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#D3D9D4">to you</text></g>
  <path d="M230 157H294" stroke="#636B65" stroke-width="2" marker-end="url(#arr)"/>
  <text x="262" y="145" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#636B65">raw</text>
  <path d="M490 157H554" stroke="#636B65" stroke-width="2" marker-end="url(#arr)"/>
  <text x="522" y="145" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#636B65">obs</text>
  <path d="M750 157H784" stroke="#1B763A" stroke-width="2" marker-end="url(#arrG)"/>
  <g><rect x="300" y="296" width="190" height="66" rx="13" fill="#E0F1FE" stroke="#1F6A96" stroke-opacity=".75" stroke-width="1.5"/>
    <text x="395" y="325" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15.5" font-weight="600" fill="#191F1A">L3 executors</text>
    <text x="395" y="346" text-anchor="middle" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#3D453E">intents to I/O</text></g>
  <path d="M655 190V329H496" fill="none" stroke="#636B65" stroke-width="2" marker-end="url(#arr)"/>
  <text x="668" y="290" text-anchor="start" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#636B65">intents</text>
  <path d="M300 329H135V196" fill="none" stroke="#636B65" stroke-width="2" marker-end="url(#arr)"/>
  <text x="150" y="318" text-anchor="start" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#636B65">keys, answers, polls</text>
  <text x="40" y="408" font-family="'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#636B65">L3 runs one decision timer at the core's next deadline and feeds the tick back in as an observation.</text>

</svg>
